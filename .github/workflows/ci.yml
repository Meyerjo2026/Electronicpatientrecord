name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    env:
      PACKAGES: >-
        --workspace=packages/core
        --workspace=packages/fhir
        --workspace=packages/sync
        --workspace=packages/security
        --workspace=packages/clinical
        --workspace=packages/nemsis
        --workspace=packages/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      # Build before typechecking: the packages resolve each other through their
      # published `dist` entrypoints, and `dist` is git-ignored, so a fresh
      # checkout has nothing to resolve until core/fhir are compiled.
      - name: Build packages
        run: npm run build $PACKAGES

      - name: Typecheck
        run: npm run typecheck $PACKAGES

      - name: Run unit tests
        run: npm test $PACKAGES

  mobile:
    name: Mobile app typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build workspace packages
        run: npm run build --workspace=packages/core --workspace=packages/fhir --workspace=packages/sync --workspace=packages/security --workspace=packages/clinical --workspace=packages/nemsis --workspace=packages/ui

      - name: Typecheck mobile app
        run: npm run typecheck --workspace=apps/mobile

  php:
    name: Laravel API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: ./vendor/bin/phpunit